name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  agent:
    name: Build Go Agent
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            ext: ""
          - os: windows-latest
            target: windows-amd64
            ext: ".exe"
          - os: macos-latest
            target: darwin-arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: agent-go/go.sum
      - name: go build
        working-directory: agent-go
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o ../dist/td-agent-${{ matrix.target }}${{ matrix.ext }} ./cmd/agent
      - name: go test
        working-directory: agent-go
        run: go test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: td-agent-${{ matrix.target }}
          path: dist/td-agent-${{ matrix.target }}${{ matrix.ext }}

  pwa:
    name: Build PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-pwa/package-lock.json
      - name: npm install
        working-directory: web-pwa
        run: npm install
      - name: npm run build
        working-directory: web-pwa
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-pwa-dist
          path: web-pwa/dist

  release:
    name: Release
    needs: [agent, pwa]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/td-agent-linux-amd64/*
            artifacts/td-agent-windows-amd64/*
            artifacts/td-agent-darwin-arm64/*
            artifacts/web-pwa-dist/**
