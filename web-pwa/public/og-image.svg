<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b3a8f"/>
      <stop offset="55%" stop-color="#0b66ef"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7ecff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative circles -->
  <circle cx="1050" cy="120" r="220" fill="#ffffff" opacity="0.06"/>
  <circle cx="1140" cy="520" r="160" fill="#ffffff" opacity="0.05"/>

  <!-- logo tile -->
  <g transform="translate(96,150)">
    <rect width="150" height="150" rx="34" fill="#ffffff" opacity="0.12"/>
    <g transform="translate(21,30) scale(0.58)">
      <path d="M48 110a30 30 0 0 1 0-60 38 38 0 0 1 72 6 28 28 0 0 1 24 54Z" fill="url(#logo)"/>
      <path d="M70 132h52a8 8 0 0 1 0 16H70a8 8 0 0 1 0-16Z" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- title -->
  <text x="280" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Telegram Drive</text>
  <text x="282" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="600" fill="#bfe0ff">Ổ Đĩa Cloud Ảo</text>

  <!-- tagline -->
  <text x="96" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="500" fill="#eaf4ff">Cloud drive cá nhân, mã nguồn mở — dùng Telegram làm</text>
  <text x="96" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="500" fill="#eaf4ff">kho lưu trữ. Mount ổ ảo, chia sẻ link, tự host.</text>

  <!-- feature chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#0b3a8f">
    <g filter="url(#soft)">
      <rect x="96"  y="510" width="220" height="60" rx="30" fill="#ffffff" opacity="0.95"/>
      <text x="206" y="549" text-anchor="middle">Self-hosted</text>
    </g>
    <g filter="url(#soft)">
      <rect x="332" y="510" width="190" height="60" rx="30" fill="#ffffff" opacity="0.95"/>
      <text x="427" y="549" text-anchor="middle">Mount T:</text>
    </g>
    <g filter="url(#soft)">
      <rect x="538" y="510" width="240" height="60" rx="30" fill="#ffffff" opacity="0.95"/>
      <text x="658" y="549" text-anchor="middle">Open source</text>
    </g>
    <g filter="url(#soft)">
      <rect x="794" y="510" width="180" height="60" rx="30" fill="#ffffff" opacity="0.95"/>
      <text x="884" y="549" text-anchor="middle">Free</text>
    </g>
  </g>

  <!-- github handle -->
  <text x="1104" y="600" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cfe6ff" opacity="0.9">github.com/ptadigi/Telegram-Drive-Mount</text>
</svg>
