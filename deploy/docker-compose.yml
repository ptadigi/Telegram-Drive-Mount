version: "3.9"

services:
  td-agent:
    image: golang:1.23
    container_name: td-agent
    working_dir: /workspace
    command: ["sh", "-c", "go run ./cmd/agent --config /etc/td-agent/config.json --data-dir /var/lib/td-agent --addr 0.0.0.0:8750"]
    environment:
      TD_AGENT_DATA_DIR: /var/lib/td-agent
      TD_AGENT_CONFIG: /etc/td-agent/config.json
    volumes:
      - ./agent-go:/workspace
      - ./deploy/config:/etc/td-agent
      - td-agent-data:/var/lib/td-agent
    ports:
      - "8750:8750"
    restart: unless-stopped

  td-pwa:
    image: node:20-alpine
    container_name: td-pwa
    working_dir: /workspace
    command: ["sh", "-c", "npm install && npm run build && npx serve dist -l 5173"]
    volumes:
      - ./web-pwa:/workspace
    ports:
      - "5173:5173"
    depends_on:
      - td-agent
    restart: unless-stopped

volumes:
  td-agent-data:
