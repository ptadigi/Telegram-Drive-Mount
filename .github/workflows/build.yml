name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  agent:
    name: Build Go Agent (default)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            ext: ""
          - os: windows-latest
            target: windows-amd64
            ext: ".exe"
          - os: macos-latest
            target: darwin-arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: agent-go/go.sum
      - name: go build
        working-directory: agent-go
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o ../dist/td-agent-${{ matrix.target }}${{ matrix.ext }} ./cmd/agent
      - name: go test
        working-directory: agent-go
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: td-agent-${{ matrix.target }}
          path: dist/td-agent-${{ matrix.target }}${{ matrix.ext }}

  windows-tray:
    name: Build Windows Agent (tray)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: agent-go/go.sum
      - name: go build tray
        working-directory: agent-go
        env:
          CGO_ENABLED: "1"
        run: go build -tags "tray" -trimpath -ldflags "-s -w" -o ../dist/td-agent-windows-amd64-tray.exe ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: td-agent-windows-amd64-tray
          path: dist/td-agent-windows-amd64-tray.exe

  windows-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: [pwa]
    env:
      CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: agent-go/go.sum
      - name: Install WinFsp
        shell: pwsh
        run: |
          $url = "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi"
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          Invoke-WebRequest -Uri $url -OutFile installer/winfsp-2.0.23075.msi
          Start-Process msiexec.exe -ArgumentList '/i','installer/winfsp-2.0.23075.msi','/qn' -Wait
      - name: go build (fuse + tray)
        working-directory: agent-go
        env:
          CGO_ENABLED: "0"
        run: go build -tags "fuse tray" -trimpath -ldflags "-s -w" -o ../installer/td-agent.exe ./cmd/agent
      - name: Download PWA dist
        uses: actions/download-artifact@v4
        with:
          name: web-pwa-dist
          path: installer/pwa
      - name: Sign agent binary
        if: ${{ env.CODE_SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          & $st.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CODE_SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 installer/td-agent.exe
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y }
          & "$iscc" installer/td-agent.iss
      - name: Sign installer
        if: ${{ env.CODE_SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          & $st.FullName sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CODE_SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 installer/Output/TelegramDriveSetup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramDriveSetup
          path: installer/Output/TelegramDriveSetup.exe

  pwa:
    name: Build PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-pwa/package-lock.json
      - name: npm install
        working-directory: web-pwa
        run: npm install
      - name: npm run build
        working-directory: web-pwa
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-pwa-dist
          path: web-pwa/dist

  release:
    name: Release
    needs: [agent, windows-tray, windows-installer, pwa]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/td-agent-linux-amd64/*
            artifacts/td-agent-windows-amd64/*
            artifacts/td-agent-windows-amd64-tray/*
            artifacts/td-agent-darwin-arm64/*
            artifacts/TelegramDriveSetup/*
            artifacts/web-pwa-dist/**
